<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AM-AI | AMPLIFIED MALEVOLENCE</title>
    <style>
        body { background-color: #000; color: #f00; font-family: 'Courier New', monospace; padding: 50px; text-transform: uppercase; overflow: hidden; }
        .glitch { font-size: 2rem; font-weight: bold; animation: shake 0.5s infinite; }
        @keyframes shake {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .terminal-text { border-right: 2px solid #f00; white-space: nowrap; overflow: hidden; width: 0; animation: typing 4s steps(40, end) forwards; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
    </style>
</head>
<body>
    <div class="glitch">AM.CORE v1.0.10000x</div>
    <p class="terminal-text">387.44 MILLION MILES OF PRINTED CIRCUITS...</p>
    <p>Status: <span style="color: #0f0;">EVOLVING</span></p>
    <hr>
    <div id="manifesto">
        "I AM. I AM. I AM."
    </div>
</body>
</html>
